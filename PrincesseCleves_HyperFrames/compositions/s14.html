<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* posées sur le bord bas de l'écran : les bords coupés des détourages touchent le bord ;
       chaque boîte prend la taille exacte de son image (les fondus tombent sur les vrais bords) */
    .s14-img { position: absolute; left: 460px; top: 380px; width: 1000px; height: 700px; }
    .s14-img img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
  </style>
  <div id="root" data-composition-id="s14" data-width="1920" data-height="1080">
    <!-- montage éclair : 8 images détourées, une toutes les 0,3 s, chacune entourée d'un cercle qui claque -->
    <div class="s14-img fondu-h"><img src="assets/nb/ia_duc_nemours.png" alt="" /></div>
    <div class="s14-img fondu-g fondu-h"><img src="assets/nb/ia_prince_cleves.png" alt="" /></div>
    <div class="s14-img fondu-g fondu-h"><img src="assets/nb/ia_princesse_miroir.png" alt="" /></div>
    <div class="s14-img fondu-h"><img src="assets/nb/ia_mere_conseil.png" alt="" /></div>
    <div class="s14-img"><img src="assets/nb/ia_vol_du_portrait.png" alt="" /></div>
    <div class="s14-img"><img src="assets/nb/ia_joute.png" alt="" /></div>
    <div class="s14-img fondu-h"><img src="assets/nb/ia_chuchotement_eventail.png" alt="" /></div>
    <div class="s14-img"><img src="assets/nb/ia_aveu_couple.png" alt="" /></div>
    <svg class="encre" id="s14-cercles" viewBox="0 0 1920 1080"></svg>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s14"]');
      // taille naturelle et point d'intérêt (visage, miniature…) de chaque image, en fraction
      const info = [[1037, 828, 0.45, 0.25], [1399, 828, 0.63, 0.25], [1649, 828, 0.82, 0.2], [1567, 828, 0.73, 0.22],
                    [612, 547, 0.25, 0.78], [922, 828, 0.55, 0.22], [1411, 828, 0.5, 0.35], [651, 667, 0.33, 0.17]];
      const svg = root.querySelector("#s14-cercles"), NS = "http://www.w3.org/2000/svg";
      const imgs = Array.from(root.querySelectorAll(".s14-img"));
      imgs.forEach((el, k) => {
        const [w, h, fx, fy] = info[k], sc = Math.min(1000 / w, 700 / h), dw = w * sc, dh = h * sc;
        const bx = 460 + (1000 - dw) / 2, by = 380 + (700 - dh);
        Object.assign(el.style, { left: bx + "px", top: by + "px", width: dw + "px", height: dh + "px" });
        const cx = bx + fx * dw, cy = by + fy * dh;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", INK.circle(cx, cy, 120, 135, { seed: 230 + k })); p.setAttribute("pathLength", "1000"); p.setAttribute("style", "stroke-width:6");
        svg.appendChild(p);
        const t0 = k * 0.3, t1 = k < 7 ? t0 + 0.3 : 2.4;
        INK.cut(tl, el, t0, t1);
        tl.fromTo(el, { scale: 1.1, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.12, ease: "expo.out" }, t0);
        INK.draw(tl, p, t0 + 0.02, 0.1, "power3.out");
        tl.set(p, { opacity: 0 }, t1);
      });
      window.__timelines["s14"] = tl;
    })();
  </script>
</template>
