  <script>
    (function () {
      const S = 84.6; // début absolu de la scène
      const tl = gsap.timeline({ paused: true });
      const P = [0, 1, 2, 3, 4, 5].map((p) => INK.words("S07", p));
      const t = (p, i) => P[p][i][1] - S; // temps local du mot i de la phrase p
      const root = document.querySelector('[data-composition-id="s07"]');
      const $ = (s) => root.querySelector(s);
      INK.shapes(root);

      INK.fontsReady(['200px "Source Serif 4"', 'italic 68px "IM FELL English"', '60px "IM FELL English"', 'italic 34px "IM FELL English"']).then(() => {
        INK.withLayout(root, () => {
        // ===== A. 84,6 : changement de monde, le papier devient parchemin =====
        tl.fromTo("#s07-medieval", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.3, ease: "power2.out" }, 0);
        ["#s07-r1", "#s07-r2", "#s07-r3", "#s07-r4"].forEach((id) => INK.draw(tl, $(id), 0.04, 0.3, "power2.out"));
        INK.draw(tl, $("#s07-r5"), 0.1, 0.3, "power2.out"); INK.draw(tl, $("#s07-r6"), 0.1, 0.3, "power2.out");

        // ===== B. « Cinq siècles plus tôt… Lancelot » : l'enluminure, la loupe =====
        tl.fromTo("#s07-enlu", { opacity: 0, scale: 1.06, rotation: -4 }, { opacity: 1, scale: 1, rotation: -1.2, duration: 0.34, ease: "expo.out" }, 0.02); // en place à 84,96 s
        tl.fromTo("#s07-cartel-enlu", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);
        // « Cinq siècles plus tôt » : un grand « vers 1180 » s'écrit à la plume
        INK.write(tl, $("#s07-date"), t(0, 0) - 0.05, 1.05, $("#s07-plume-pt2"), { x: 1010, y: 612 + 118, w: 658 });
        INK.draw(tl, $("#s07-date-trait"), t(0, 3) + 0.12, 0.35, "power2.out");
        INK.draw(tl, $("#s07-cercle"), t(0, 6) - 0.05, 0.42, "power2.inOut"); // se referme sur « Lancelot »
        INK.draw(tl, $("#s07-tan1"), t(0, 7) + 0.12, 0.25, "power2.out");
        INK.draw(tl, $("#s07-tan2"), t(0, 7) + 0.16, 0.25, "power2.out");
        INK.draw(tl, $("#s07-loupe-c"), t(0, 7) + 0.3, 0.42, "power2.out");
        tl.fromTo("#s07-loupe", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(50% at 50% 50%)", duration: 0.4, ease: "power2.out" }, t(0, 7) + 0.34);

        // ===== C. « montait dans une charrette d'infamie » =====
        tl.fromTo("#s07-charrette", { opacity: 0, x: 140, rotation: 4 }, { opacity: 1, x: 0, rotation: 1, duration: 0.5, ease: "expo.out" }, t(0, 5) - 0.1); // « un chevalier »
        INK.draw(tl, $("#s07-fleche"), t(0, 11), 0.45, "power2.inOut"); // « charrette »
        INK.draw(tl, $("#s07-fleche-a"), t(0, 11) + 0.42, 0.14, "power2.out");

        // ===== D. « pour la reine qu'il aimait » : le point rouge part de Lancelot vers la reine =====
        INK.draw(tl, $("#s07-passion-halo"), t(0, 14), 0.6, "power2.inOut");
        tl.set("#s07-passion-halo", { opacity: 0.55 }, t(0, 14));
        INK.draw(tl, $("#s07-passion"), t(0, 14), 0.6, "power2.inOut");
        tl.fromTo("#s07-point", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, t(0, 14) - 0.1);
        INK.travel(tl, $("#s07-point"), INK.linePts(1292, 246, 978, 300, { seed: 66, bow: -70, wobble: 3 }), t(0, 14), 0.6, "power2.inOut");
        tl.to("#s07-point", { scale: 0.6, duration: 0.3, ease: "power2.out" }, t(0, 14) + 0.6);

        // ===== E. « Chrétien de Troyes… » : écrit à la plume =====
        // le grand « vers 1180 » (190 px) rejoint sa place à la fin de la 2e ligne écrite (60 px) : lignes de base alignées
        const sc = 60 / 190, dx = 730 + 590 + 29 - 1010, dy = 112;
        tl.to("#s07-date-trait", { opacity: 0, duration: 0.2 }, t(1, 0) - 0.4);
        tl.fromTo("#s07-date", { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: sc, duration: 0.6, ease: "power2.inOut", immediateRender: false }, t(1, 0) - 0.4);
        INK.write(tl, $("#s07-l1"), t(1, 0) - 0.05, 0.95, $("#s07-plume-pt"), { x: 0, y: 57, w: 492 });
        INK.write(tl, $("#s07-l2"), t(1, 0) + 1.0, 1.55, $("#s07-plume-pt"), { x: 0, y: 92 + 57, w: 827 });

        // ===== F. coupe franche : trois gros mots, chacun barré de rouge =====
        const tCut = t(2, 0) - 0.16;
        tl.set("#s07-monde1", { opacity: 0 }, tCut);
        tl.set("#s07-mots", { opacity: 0 }, 0);
        tl.set("#s07-mots", { opacity: 1 }, tCut);
        const mots = root.querySelector("#s07-mots");
        const impacts = [95.96, 97.3, 98.6];
        [1, 2, 3].forEach((k) => {
          const p = k + 1; // phrases 2, 3, 4
          const rang = $("#s07-rang" + k), petits = rang.querySelectorAll(".petit span"), gros = $("#s07-g" + k);
          petits.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, t(p, i) - 0.09)); // visible 0,05 s avant le mot
          const tg = t(p, 3) - 0.09; // le gros mot claque quand il est dit
          tl.fromTo(gros, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.18, ease: "expo.out" }, tg);
          // rature rouge sur l'impact (au plus tôt juste après l'apparition du mot)
          const x = 736, y = [120, 400, 680][k - 1] + 6, w = [811, 422, 709][k - 1], h = 200; // largeurs mesurées (Source Serif 900, 200 px)
          const path = $("#s07-x" + k);
          path.setAttribute("d", INK.strike(x - 34, y + h * 0.58, x + w + 34, y + h * 0.5, { seed: 70 + k, bow: -12 }));
          const ts = Math.max(impacts[k - 1] - S - 0.08, tg + 0.08);
          INK.draw(tl, path, ts, 0.13, "power3.out");
        });

        // ===== G. « Madame de Lafayette pose une autre question » : retour au papier du XVIIe =====
        // un grand trait d'encre balaie tout l'écran ; les deux mondes s'échangent sous l'encre (jamais superposés)
        const tWipe = t(5, 0) - 0.33; // écran entièrement couvert à 99,82 s, la femme apparaît avant « Madame » (100,15)
        INK.draw(tl, $("#s07-trait"), tWipe - 0.28, 0.28, "power2.in");
        tl.set("#s07-medieval", { opacity: 0 }, tWipe);
        tl.set("#s07-plume", { opacity: 0 }, 0);
        tl.set("#s07-plume", { opacity: 1 }, tWipe);
        INK.undraw(tl, $("#s07-trait"), tWipe + 0.02, 0.3, "power2.out");
        tl.fromTo("#s07-femme", { rotation: -1, scale: 1.02 }, { rotation: -1, scale: 1, duration: 4, ease: "none" }, tWipe);
        // sa plume trace un grand « ? »
        INK.draw(tl, $("#s07-q"), t(5, 3) - 0.2, 1.75, "power1.inOut");
        tl.fromTo("#s07-qpoint", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, t(5, 3) + 1.6);

        // ===== H. 104,0 : carton « Et si l'amour plus fort que tout / était un danger ? » =====
        const tC = 104.0 - S;
        tl.set("#s07-plume", { opacity: 0 }, tC);
        tl.set("#s07-carton", { opacity: 0 }, 0);
        tl.set("#s07-carton", { opacity: 1 }, tC);
        tl.fromTo("#s07-fumee-cadre", { scale: 1.85, yPercent: 6 }, { scale: 1.75, yPercent: -2, duration: 5, ease: "none" }, tC);
        tl.fromTo("#s07-fumee-cadre-b", { scaleX: -1.6, scaleY: 1.6, yPercent: 10 }, { scaleX: -1.5, scaleY: 1.5, yPercent: 2, duration: 5, ease: "none" }, tC);
        const mc = Array.from(root.querySelectorAll("#s07-carton-texte span"));
        mc.forEach((el, i) => {
          const tw = i < 7 ? 104.4 - S + i * 0.09 : 105.2 - S + (i - 7) * 0.11;
          if (el.classList.contains("q")) {
            tl.fromTo(el, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 105.2 - S + 0.55);
          } else {
            tl.fromTo(el, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, tw);
          }
        });

        });
        window.__timelines["s07"] = tl;
      });
    })();
  </script>
