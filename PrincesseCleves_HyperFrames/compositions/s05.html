  <script>
    (function () {
      const S = 45.6;
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s05"]');
      const $ = (s) => root.querySelector(s);
      const P = [0, 1, 2, 3, 4, 5].map((p) => INK.words("S05", p));
      const t = (p, i) => P[p][i][1] - S;
      INK.shapes(root);
      INK.fontsReady(['900 200px "Source Serif 4"', 'italic 100px "IM FELL English"', 'italic 34px "IM FELL English"']).then(() => {
        INK.withLayout(root, () => {
          // ===== temps 1
          tl.fromTo("#s05-elle", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.05);
          INK.write(tl, $("#s05-nom"), t(0, 2) - 0.05, 1.15, $("#s05-plume")); // le nom s'écrit à la plume
          INK.draw(tl, $("#s05-enclos"), t(1, 4) - 0.05, 0.9, "power2.inOut"); // « loin de la cour »
          INK.draw(tl, $("#s05-regle"), t(1, 11) - 0.05, 0.45, "power2.out");  // « une seule règle »
          INK.cut(tl, "#s05-vertu", t(1, 12) - 0.05);                          // « la vertu. »
          tl.set("#s05-t1", { opacity: 0 }, t(2, 0) - 0.12);

          // ===== temps 2 : « Elle épouse le prince de Clèves. »
          INK.cut(tl, "#s05-t2", t(2, 0) - 0.12);
          tl.fromTo("#s05-elle2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(2, 0) - 0.12);
          INK.pin(tl, "#s05-masson", t(2, 0) - 0.1, { rot: -1, dur: 0.45 });
          INK.fade(tl, "#s05-cartel-masson", t(2, 0) + 0.25);
          tl.fromTo("#s05-cleves", { opacity: 0, x: -180 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t(2, 3) - 0.1); // Clèves entre
          INK.unpin(tl, "#s05-masson", t(3, 0) - 0.3, { dy: -40 });
          tl.to("#s05-cartel-masson", { opacity: 0, duration: 0.2 }, t(3, 0) - 0.3);

          // ===== temps 3 : le point de vue
          INK.draw(tl, $("#s05-spirale"), t(3, 0) - 0.05, 1.4, "power1.inOut");   // « Lui l'aime à la folie » : spirale rouge
          INK.draw(tl, $("#s05-droite"), t(4, 0) - 0.05, 1.1, "power1.inOut");    // « Elle, elle l'estime » : ligne droite, calme
          INK.cut(tl, "#s05-aimer", t(5, 0) - 0.05);                              // « Ce n'est pas la même chose »
          INK.draw(tl, $("#s05-ne1"), t(5, 2) - 0.05, 0.14, "power2.out");
          INK.draw(tl, $("#s05-ne2"), t(5, 2) + 0.08, 0.14, "power2.out");
          INK.draw(tl, $("#s05-ne3"), t(5, 3), 0.16, "power2.out");
          INK.cut(tl, "#s05-estimer", t(5, 5) - 0.05);
        });
        window.__timelines["s05"] = tl;
      });
